<h2>Lista de Usuários</h2>
<button routerLink="/new">Novo Usuário</button>

<table>
  <tr>
    <th>ID</th>
    <th>Nome</th>
    <th>Email</th>
    <th>Ações</th>
  </tr>
  <tr *ngFor="let user of users">
    <td>{{ user.id }}</td>
    <td>{{ user.name }}</td>
    <td>{{ user.email }}</td>
    <td>
      <button [routerLink]="['/edit', user.id]">Editar</button>
      <button (click)="deleteUser(user.id!)">Excluir</button>
    </td>
  </tr>
</table>
