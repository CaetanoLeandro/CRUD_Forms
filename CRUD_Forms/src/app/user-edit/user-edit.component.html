<h2>{{ id ? 'Editar Usuário' : 'Novo Usuário' }}</h2>

<form [formGroup]="form" (ngSubmit)="save()">
  <label>Nome:</label>
  <input formControlName="name">
  <label>Email:</label>
  <input formControlName="email">
  
  <button type="submit">Salvar</button>
  <button routerLink="/">Cancelar</button>
</form>
